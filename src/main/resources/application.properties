spring.application.name=musicsstore-api

spring.datasource.url=jdbc:mysql://localhost:3306/musics_store?useSSL=false&serverTimezone=UTC
spring.datasource.username=msuser
spring.datasource.password=msuser_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
